name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**"
      
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Current directory:"
          pwd
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0 cython==0.29.36

      - name: Find Buildozer project
        run: |
          SPEC=$(find "$GITHUB_WORKSPACE" -name buildozer.spec -type f | head -n 1)

          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec was not found anywhere."
            exit 1
          fi

          echo "Found buildozer.spec:"
          echo "$SPEC"

          cd "$(dirname "$SPEC")"
          pwd
          ls -la

      - name: Build debug APK
        run: |
          SPEC=$(find "$GITHUB_WORKSPACE" -name buildozer.spec -type f | head -n 1)
          cd "$(dirname "$SPEC")"
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-play-game-apk
          path: "**/bin/*.apk"
          if-no-files-found: error
          retention-days: 14
